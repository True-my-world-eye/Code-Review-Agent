# =============================================================
# Code Review Agent 配置模板
# 使用方法：复制为 config.yaml 并填写；config.yaml 已被 gitignore，
#          实际的 api_key 不会进入版本库。
# 配置优先级：CLI 参数 > 环境变量(CRA_*) > 本文件 > 服务商预设
# =============================================================

# 服务商：deepseek | mimo | openai-compatible（自定义任意兼容端点）
provider: deepseek

# API 端点；留空则使用所选服务商的内置预设
base_url: ""

# API Key；留空则读取环境变量 CRA_API_KEY（推荐生产环境用环境变量）
api_key: ""

# 模型名；留空则使用所选服务商的内置预设
model: ""

# ---- 运行参数 ----
temperature: 0.2       # 0~2，审查任务建议偏低以保证输出稳定
max_iterations: 8      # Agent 循环最大轮数（防止失控）
tool_timeout: 30       # 单个工具执行超时（秒）
auto_fix_enabled: true # 是否允许自动修复工具（执行前仍需用户逐次确认）
