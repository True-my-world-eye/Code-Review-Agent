<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Review Agent</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ================= 顶栏 ================= -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot">◆</span> Code Review Agent</div>
    <div class="topbar-right">
      <span id="connPill" class="pill pill-idle">未配置</span>
      <button id="btnSettings" class="btn btn-ghost" type="button">⚙ 设置</button>
    </div>
  </header>

  <div class="layout">
    <!-- ================= 侧栏 ================= -->
    <aside class="sidebar">
      <button id="btnNew" class="btn btn-primary btn-block" type="button">＋ 新建审查</button>
      <div class="side-title">审查历史</div>
      <ul id="historyList" class="history">
        <li class="history-empty">暂无记录</li>
      </ul>
    </aside>

    <!-- ================= 主区 ================= -->
    <main class="main">
      <!-- 审查目标 -->
      <section class="card">
        <div class="tabs">
          <button class="tab active" data-mode="path" type="button">项目路径</button>
          <button class="tab" data-mode="code" type="button">粘贴代码</button>
        </div>

        <div id="panePath" class="pane">
          <input id="inputPath" class="input" type="text"
                 value="." placeholder="相对项目的路径，如 src、app.py（. 表示整个项目）">
        </div>

        <div id="paneCode" class="pane hidden">
          <input id="inputFileName" class="input" type="text"
                 value="snippet.py" placeholder="文件名（决定语言高亮与报告定位）">
          <textarea id="inputCode" class="textarea" rows="8"
                    placeholder="粘贴要审查的代码…"></textarea>
        </div>

        <div class="row">
          <input id="inputAsk" class="input grow" type="text"
                 placeholder="补充要求（可选），如：重点关注安全漏洞">
          <button id="btnReview" class="btn btn-primary" type="button">开始审查 ▶</button>
        </div>
      </section>

      <!-- 执行时间线 -->
      <section id="timelineCard" class="card hidden">
        <div class="card-title">
          执行时间线
          <span id="timelineStatus" class="status running">运行中…</span>
        </div>
        <ul id="timeline" class="timeline"></ul>
      </section>

      <!-- 审查报告 -->
      <section id="reportCard" class="card hidden">
        <div class="card-title">审查报告</div>
        <div id="reportSummary" class="summary"></div>
        <div id="issuesList" class="issues"></div>
        <div id="reportMeta" class="meta"></div>
      </section>

      <!-- 降级原文（JSON 解析失败时展示） -->
      <section id="rawCard" class="card hidden">
        <div class="card-title">Agent 输出</div>
        <pre id="rawContent" class="raw"></pre>
      </section>
    </main>
  </div>

  <!-- ================= 设置对话框 ================= -->
  <dialog id="settingsDialog" class="dialog">
    <form id="settingsForm" method="dialog">
      <div class="dialog-title">LLM 服务设置</div>

      <label class="field">
        <span>服务商</span>
        <select id="cfgProvider" class="input"></select>
      </label>

      <label class="field">
        <span>API 端点（留空用预设）</span>
        <input id="cfgBaseUrl" class="input" type="text" placeholder="https://...">
      </label>

      <label class="field">
        <span>API Key（留空保持不变）</span>
        <input id="cfgApiKey" class="input" type="password"
               autocomplete="off" placeholder="sk-...">
      </label>

      <label class="field">
        <span>模型（留空用预设）</span>
        <input id="cfgModel" class="input" type="text" placeholder="deepseek-chat">
      </label>

      <div class="field-grid">
        <label class="field">
          <span>温度 (0~2)</span>
          <input id="cfgTemperature" class="input" type="number" step="0.1" min="0" max="2">
        </label>
        <label class="field">
          <span>循环上限</span>
          <input id="cfgMaxIter" class="input" type="number" min="1" max="50">
        </label>
      </div>

      <label class="check">
        <input id="cfgAutoFix" type="checkbox">
        <span>允许自动修复（执行前仍需逐次确认）</span>
      </label>

      <div id="settingsMsg" class="dialog-msg hidden"></div>

      <div class="dialog-actions">
        <button id="btnTestConn" class="btn btn-ghost" type="button">测试连接</button>
        <span class="spacer"></span>
        <button id="btnCancelSettings" class="btn btn-ghost" type="button">取消</button>
        <button id="btnSaveSettings" class="btn btn-primary" type="button">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 轻提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
